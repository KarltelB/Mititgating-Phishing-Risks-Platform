    <!-- ── STYLES: All CSS for the platform. Uses CSS variables defined
         in :root for consistent theming throughout ── -->
    <style>
        /* ═══ STADIUM THEME OVERRIDES ═══ */

        :root {
            --navy: #0a1628;
            --navy-mid: #0f2a4a;
            --navy-light: #1a3a5c;
            --green: #00d4aa;
            --green-dark: #00a884;
            --amber: #f5a623;
            --white: #ffffff;
            --off-white: #f4f6f9;
            --card-bg: #ffffff;
            --text-dark: #1a1a2e;
            --text-mid: #4a5568;

            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f1f3d;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--off-white);
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* ── Header ── */
        .header {
            background: linear-gradient(135deg, #0a1628 0%, #0f2a4a 50%, #0a1628 100%);
            color: white;
            padding: 60px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 40px,
                    rgba(0,212,170,0.04) 40px,
                    rgba(0,212,170,0.04) 41px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 40px,
                    rgba(0,212,170,0.04) 40px,
                    rgba(0,212,170,0.04) 41px

        .header h1 {
            font-size: 2.8em;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.3);
            position: relative;
        }

        .header h1 span {
            color: var(--green);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.85;
            margin-top: 8px;
            position: relative;
        }

        /* ── Content area ── */
        .content {
            padding: 50px 40px;
            background: var(--off-white);
        }

        /* ── Module cards ── */
        .module-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-top: 4px solid var(--green);
        }

        .module-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 40px rgba(0,212,170,0.15);
            border-top-color: var(--amber);
        }

        .module-card h3 {
            color: var(--navy);
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .module-card p {
            color: var(--text-mid);
            margin-bottom: 20px;
        }

        /* ── Buttons ── */
        .btn {
            background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
            color: var(--navy);
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 0.95em;
            cursor: pointer;

        /* ── Module header ── */

        /* ── Severity badges ── */

        /* ── Quiz ── */

        .quiz-option.selected { border-color: var(--green); background: #e6fff9; }

        /* ── Submit button ── */
        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
            color: var(--navy);
            border: none;
            border-radius: 10px;
            font-size: 1.1em;

            cursor: pointer;
            margin-top: 30px;

            letter-spacing: 0.3px;

        .submit-btn:hover:not(:disabled) {

        .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ── Results ── */
        .results {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);

            padding: 50px;

        .results.show { display: block; animation: slideIn 0.5s ease; }

        /* ── Tactic accordion ── */
        .tactic-accordion { border: 2px solid var(--border); border-radius: 12px; overflow: hidden; }
        .tactic-toggle { background: white; border: none; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; font-size: 1.05em; font-weight: 600; color: var(--navy); cursor: pointer; text-align: left; transition: background 0.2s; }

        .tactic-example-box { background: white; border-left: 4px solid var(--green); border-radius: 0 8px 8px 0; padding: 14px 16px; margin-top: 14px; font-size: 0.95em; color: var(--text-dark); line-height: 1.7; }

        /* ── Red flag accordion ── */
        .redflag-accordion { border: 2px solid var(--border); border-radius: 12px; overflow: hidden; }
        .redflag-toggle { background: white; border: none; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; font-size: 1em; cursor: pointer; text-align: left; transition: background 0.2s; }
        .redflag-toggle:hover { background: #f0fdf9; }
        .redflag-body { padding: 20px; background: #fafffe; border-top: 1px solid var(--border); color: var(--text-mid); line-height: 1.75; font-size: 0.97em; }
        .redflag-example { background: white; border-left: 4px solid #ff6b6b; border-radius: 0 8px 8px 0; padding: 14px 16px; margin-top: 14px; font-size: 0.95em; color: var(--text-dark); line-height: 1.8; }

        /* ── Flip cards ── */
        .flip-card-front { background: linear-gradient(135deg, #f0fdf9 0%, #e6f7f4 100%); border: 2px solid var(--green); }
        .flip-card-back { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%); }

        /* ── Feedback boxes ── */
        .feedback-correct { background: #e6fff9; border: 2px solid var(--green); color: #1b5e20; }
        .feedback-wrong { background: #ffebee; border: 2px solid #f44336; color: #c62828; }

        /* ── Gradient helpers ── */
        .gradient-red { background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%); }
        .gradient-orange { background: linear-gradient(135deg, #ffa726 0%, #ff9800 100%); }
        .gradient-green { background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%); }
        .gradient-purple { background: linear-gradient(135deg, var(--navy-mid) 0%, var(--navy) 100%); }
        .gradient-blue { background: linear-gradient(135deg, #42a5f5 0%, #1e88e5 100%); }
        .gradient-cyan { background: linear-gradient(135deg, #26c6da 0%, #00acc1 100%); }

        /* ── Email form ── */
        .email-form input:focus { border-color: var(--green); outline: none; }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.9em; }
            .content { padding: 30px 20px; }
            .module-header { flex-direction: column; text-align: center; }
            .exercise-options { grid-template-columns: 1fr; }
            .modules-grid { grid-template-columns: 1fr; }
            .header { padding: 40px 20px; }
        }


        /* ── Story Steps ── */
        .story-step {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            background: white;
            border-radius: 14px;
            padding: 22px;
            border: 2px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .story-step-end {
            border-color: #f44336;
        }

        .story-number {
            background: var(--green);
            color: var(--navy);
            font-weight: 800;
            font-size: 1.1em;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .story-content {
            flex: 1;
        }

        .story-message {
            background: #f8fafc;
            border-radius: 10px;
            padding: 15px 18px;
            margin-bottom: 14px;
            border-left: 4px solid var(--navy-mid);
            font-size: 0.97em;
            line-height: 1.7;
            color: var(--text-dark);
        }

        .story-sender {
            display: block;
            font-size: 0.82em;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .story-tactic {
            background: linear-gradient(135deg, #fff8e6 0%, #fff3d4 100%);
            border-left: 4px solid var(--amber);
            border-radius: 0 8px 8px 0;
            padding: 12px 16px;
            font-size: 0.93em;
            color: var(--text-dark);
            line-height: 1.7;
        }

        .story-tactic-label {
            font-weight: 700;
            color: #8a6000;
        }

        .story-connector {
            width: 3px;
            height: 25px;
            background: var(--green);
            margin-left: 40px;
            opacity: 0.5;
        }

    </style>
</head>
<body>
    <!-- ── MAIN CONTAINER: wraps the entire platform ── -->
    <div class="container">
        <!-- ── SITE HEADER: displayed on every page ── -->
        <!-- ── SITE HEADER ──
         Always visible at the top of every page.
         Contains the platform title and subtitle. ──>
        <div class="header">
            <h1>🛡️ Stadium Fan <span>Phishing Awareness</span></h1>
            <p>Learn how to protect yourself from phishing scams while enjoying the game</p>
        </div>

        <div class="content" id="mainContent">
            <!-- Home View -->
            <div id="homeView" class="home-view">
                <!-- ── MODULE CARDS GRID ──
                     Each card calls loadModule() with its module ID
                     when clicked, replacing the content area with that module. ──>
                <div class="modules-grid">
                    <div class="module-card" onclick="loadModule('understanding-phishing')">
                        <div class="icon">🎣</div>
                        <h3>Understanding Phishing</h3>
                        <p>Learn what phishing is and how it works</p>
                        <button class="btn">Start Learning →</button>
                    </div>

                    <div class="module-card" onclick="loadModule('spot-the-signs')">
                        <div class="icon">🔍</div>
                        <h3>Spot the Signs</h3>
                        <p>Identify suspicious emails and websites</p>
                        <button class="btn">Start Learning →</button>
                    </div>

                    <div class="module-card" onclick="loadModule('social-engineering')">
                        <div class="icon">🎭</div>
                        <h3>Social Engineering</h3>
                        <p>Understand manipulation tactics</p>
                        <button class="btn">Start Learning →</button>
                    </div>

                    <div class="module-card" onclick="loadModule('staying-safe')">
                        <div class="icon">🛡️</div>
                        <h3>Staying Safe</h3>
                        <p>Best practices for online security</p>
                        <button class="btn">Start Learning →</button>
                    </div>
                </div>

                <!-- ── QUIZ CALL-TO-ACTION ──
                     Shown at the bottom of the homepage.
                     Navigates to the quiz module when clicked. ──>
                <div class="quiz-section">
                    <h2>Ready to Test Your Knowledge?</h2>
                    <p style="color: #666; margin-bottom: 25px; font-size: 1.1em;">Take the interactive quiz to check what you've learned</p>
                    <button class="btn" onclick="loadModule('test-knowledge')" style="font-size: 1.1em; padding: 15px 40px; background: var(--amber); color: var(--navy);">Take the Quiz →</button>
                </div>
            </div>

            <!-- Module Views -->
            <div id="moduleView" style="display: none;">
                <div onclick="loadModule('home')" class="back-btn">← Back to Home</div>
                <div id="moduleContent"></div>
            </div>
        </div>
    </div>

    <!-- ── JAVASCRIPT: All platform logic ──
     Key functions:
     - loadModule(id): renders the correct module/page into #main-content
     - answerExercise(): handles interactive exercise submissions
     - toggleTactic() / toggleRedFlag(): accordion expand/collapse
     - submitQuiz(): scores and displays quiz results
     - sendResultsEmail(): sends results via EmailJS
     - answerSafety(): handles Module 4 scenario exercise
     - selectTactic() / checkTactics(): Module 3 tactic exercises
── -->
    <script>
        // ════════════════════════════════════════════════════════════
        // FUNCTION: loadModule(moduleId)
        // PURPOSE:  The main navigation function of the platform.
        //           Called every time a user clicks a module card,
        //           a back button, or any navigation link.
        // HOW IT WORKS:
        //   1. Gets the homeView and moduleView divs from the DOM
        //   2. Hides homeView and shows moduleView (or vice versa
        //      when returning home)
        //   3. Looks up the moduleId in the 'modules' object
        //   4. Injects the matching HTML into #moduleContent
        //   5. If module is 'test-knowledge', runs quiz setup
        //   6. Scrolls back to the top of the page
        // PARAMETERS:
        //   moduleId (string) — e.g. 'home', 'understanding-phishing',
        //   'spot-the-signs', 'social-engineering',
        //   'staying-safe', 'test-knowledge'
        // ════════════════════════════════════════════════════════════
        function loadModule(moduleId) {
            const homeView = document.getElementById('homeView');
            const moduleView = document.getElementById('moduleView');
            const moduleContent = document.getElementById('moduleContent');

            if (moduleId === 'home') {
                homeView.style.display = 'block';
                moduleView.style.display = 'none';
                return;
            }

            homeView.style.display = 'none';
            moduleView.style.display = 'block';

            // ════════════════════════════════════════════════════════════
// OBJECT: modules
// PURPOSE: Stores all page content as HTML template strings.
//          Each key is a moduleId string, each value is the
//          full HTML for that page.
//          loadModule() uses this object to inject content
//          into #main-content when the user navigates.
// NOTE:    This is a single-page application (SPA) — there
//          are no separate HTML files. All content lives here.
// ════════════════════════════════════════════════════════════
const modules = {
                'understanding-phishing': `
                    <div class="module-header">
                        <div class="icon">🎣</div>
                        <div>
                            <h1>Understanding Phishing</h1>
                            <p>Learn what phishing is and how attackers use it to target stadium fans</p>
                        </div>
                    </div>

                    <div class="lesson-content">
                        <h2>What is Phishing?</h2>
                        <div class="lesson-box">
                            <strong>Definition:</strong> Phishing is a cyber attack where criminals impersonate legitimate organisations to trick users into revealing sensitive information like passwords, credit card numbers, or personal data. Think of it as digital deception — the attacker doesn't hack your computer, they hack <em>you</em>.
                        </div>
                    </div>

                    <div class="lesson-content">
                        <h2>Common Tactics — and Why They Work</h2>
                        <p style="color: #666; margin-bottom: 25px; font-size: 1.05em;">Click each tactic to understand how it works and why people fall for it.</p>

                        <div style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px;">

                            <div class="tactic-accordion">
                                <button class="tactic-toggle" onclick="toggleTactic('t1')">
                                    <span>🖥️ Fake Login Pages</span><span class="tactic-arrow" id="arrow-t1">▼</span>
                                </button>
                                <div class="tactic-body" id="t1" style="display:none;">
                                    <p>Criminals build websites that look <strong>identical</strong> to real ticketing sites — same logo, same colours, same layout. When you type in your username and password, you think you're logging into your account. You're not. You're handing your details directly to the attacker.</p>
                                    <div class="tactic-example-box">
                                        <strong>Real example:</strong> You Google "Manchester United tickets" and click a sponsored link. The site looks perfect. You log in. Within hours, someone else is using your account to buy tickets with your saved payment details.
                                    </div>
                                </div>
                            </div>

                            <div class="tactic-accordion">
                                <button class="tactic-toggle" onclick="toggleTactic('t2')">
                                    <span>⏰ Urgent Payment Requests</span><span class="tactic-arrow" id="arrow-t2">▼</span>
                                </button>
                                <div class="tactic-body" id="t2" style="display:none;">
                                    <p>Attackers send messages claiming your payment has failed, your ticket is about to be cancelled, or you must pay within the next hour. This <strong>time pressure stops you thinking clearly</strong>. When we panic, we skip the checks we'd normally do.</p>

        function selectQuizOption(questionId, optionIndex, isMultiple, element) {

        function updateSubmitButton() {
            const submitBtn = document.getElementById('submitBtn');
            const answeredCount = Object.keys(window.quizAnswers).length;
            const totalQuestions = window.quizData.length;
            submitBtn.disabled = answeredCount < totalQuestions;
        }

        // ════════════════════════════════════════════════════════════
        // FUNCTION: submitQuiz()
        // PURPOSE:  Scores the completed quiz and shows the
        //           email collection screen.
        // HOW IT WORKS:
        //   1. Loops through all questions in window.quizData
        //   2. For each question, checks the user's stored answer
        //      against the correct answer(s)
        //   3. For multiple-answer questions, checks that ALL
        //      correct options are selected and NO incorrect
        //      options are selected
        //   4. Calculates score and percentage
        //   5. Stores results in window.quizResults for use
        //      by sendResultsEmail() and showQuizResults()
        //   6. Hides the quiz and shows the email input form
        // ════════════════════════════════════════════════════════════
        function submitQuiz() {
            let correct = 0;
            
            Object.entries(window.quizAnswers).forEach(([qId, answers]) => {
                const question = window.quizData.find(q => q.id === qId);
                
                if (question.multipleAnswer) {
                    // For checkbox questions, check if ALL correct answers are selected and NO incorrect answers
                    const selectedAnswers = Array.isArray(answers) ? answers : [answers];
                    const correctAnswerIndices = question.options
                        .map((opt, idx) => opt.correct ? idx : -1)
                        .filter(idx => idx !== -1);
                    
                    const allCorrectSelected = correctAnswerIndices.every(idx => selectedAnswers.includes(idx));
                    const noIncorrectSelected = selectedAnswers.every(idx => question.options[idx].correct);
                    
                    if (allCorrectSelected && noIncorrectSelected) {
                        correct++;
                    }
                } else {
                    // For radio button questions, check single answer
                    if (question.options[answers].correct) {
                        correct++;
                    }
                }
            });

            const total = window.quizData.length;
            const percentage = Math.round((correct / total) * 100);

            // Store results for email
            window.quizResults = {
                correct: correct,
                total: total,
                percentage: percentage
            };

            // Show email form
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('emailForm').style.display = 'block';
        }

        // ════════════════════════════════════════════════════════════
        // FUNCTION: sendResultsEmail()
        // PURPOSE:  Sends the user's quiz results to their email
        //           address automatically using EmailJS.
        // HOW IT WORKS:
        //   1. Gets the email address from #emailInput field
        //   2. Validates it contains '@' character
        //   3. Builds an answer breakdown string from quizAnswers
        //   4. Determines areas to review based on percentage score
        //   5. Disables the send button and shows loading state
        //   6. Calls emailjs.send() with:
        //      - Service ID: the connected email service
        //      - Template ID: the EmailJS template
        //      - Variables: to_email, score, percentage, feedback
        //   7. On success: shows confirmation and loads results page
        //   8. On failure: re-enables button and shows error alert
        // NOTE: EmailJS SDK is loaded in the <head> and initialised
        //       with the public key on page load
        // ════════════════════════════════════════════════════════════
        function sendResultsEmail() {
            const email = document.getElementById('emailInput').value;

            if (!email || !email.includes('@')) {
                alert('Please enter a valid email address');
                return;
            }

            const results = window.quizResults;
            const quizData = window.quizData;
            const quizAnswers = window.quizAnswers;

            // Build answer breakdown
            let breakdown = '';
            quizData.forEach((question, idx) => {
                const userAnswer = quizAnswers[question.id];
                let isCorrect = false;

                if (question.multipleAnswer) {
                    const selected = Array.isArray(userAnswer) ? userAnswer : [userAnswer];
                    const correctIndices = question.options
                        .map((opt, i) => opt.correct ? i : -1)
                        .filter(i => i !== -1);
                    isCorrect = correctIndices.every(i => selected.includes(i)) &&
                                selected.every(i => question.options[i].correct);
                } else {
                    isCorrect = question.options[userAnswer] && question.options[userAnswer].correct;
                }

                breakdown += 'Q' + (idx + 1) + ': ' + (isCorrect ? '✓ Correct' : '✗ Incorrect') + '\n';
            });

            // Build areas to review
            let areasToReview = '';
            if (results.percentage < 70) {
                areasToReview = '- Phishing Recognition\n- Email Red Flags\n- Security Best Practices';
            } else if (results.percentage < 85) {
                areasToReview = '- Advanced Phishing Techniques\n- Social Engineering Tactics';
            } else {
                areasToReview = "You've done great! Keep these practices in mind!";
            }

            // Disable button and show sending state
            const sendBtn = document.querySelector('#emailForm .btn');
            sendBtn.textContent = '⏳ Sending...';
            sendBtn.disabled = true;

            // Send via EmailJS
            emailjs.send('service_45hx4sm', 'template_ismgzys', {
                to_email: email,
                score: results.correct + '/' + results.total,
                percentage: results.percentage,
                feedback: breakdown + '\nAreas to Review:\n' + areasToReview
            })
            .then(function() {
                sendBtn.textContent = '✅ Results Sent!';
                setTimeout(showQuizResults, 1200);
            })
            .catch(function(error) {
                console.error('EmailJS error:', error);
                sendBtn.textContent = '📧 Send Results to Email';
                sendBtn.disabled = false;
                alert('There was an issue sending your results. Please try again.');
            });
        }

        // ════════════════════════════════════════════════════════════
        // FUNCTION: showQuizResults()
        // PURPOSE:  Displays the final results screen after the
        //           email has been sent successfully.
        // HOW IT WORKS:
        //   1. Hides the email form
        //   2. Shows the .results div with animation
        //   3. Populates the score, percentage, and grade message
        //   4. Lists which modules the user should review based
        //      on their score (below 70% = review all,
        //      70-84% = review advanced topics,
        //      85%+ = strong performance)
        // ════════════════════════════════════════════════════════════
        function showQuizResults() {
            const results = window.quizResults;
            document.getElementById('emailForm').style.display = 'none';
            document.getElementById('quizResults').classList.add('show');
            document.getElementById('scoreDisplay').textContent = `${results.correct}/${results.total}`;
            document.getElementById('scoreMessage').textContent = `You got ${results.correct} out of ${results.total} questions correct! (${results.percentage}%)`;
        }

        // Flip card function
        function toggleFlip(element) {
            element.classList.toggle('flipped');
        }



        // ════════════════════════════════════════════════════════════
        // FUNCTION: toggleTactic(id)
        // PURPOSE:  Opens or closes an accordion card in Modules 1,
        //           3, and 4. Used for the tactic explanations,
        //           common tactics, and WiFi threat sections.
        // HOW IT WORKS:
        //   1. Finds the body div by id
        //   2. Finds the arrow span by 'arrow-' + id
        //   3. Toggles display between 'none' and 'block'
        //   4. Rotates the arrow 180° when open to signal direction
        // PARAMETER:
        //   id (string) — matches the id on the body div
        //                 e.g. 't1', 'se1', 'wifi1'
        // ════════════════════════════════════════════════════════════
        function toggleTactic(id) {
            const body = document.getElementById(id);
            const arrow = document.getElementById('arrow-' + id);
            if (body.style.display === 'none') {
                body.style.display = 'block';
                arrow.style.transform = 'rotate(180deg)';
            } else {
                body.style.display = 'none';
                arrow.style.transform = 'rotate(0deg)';
            }
        }


        // ════════════════════════════════════════════════════════════
        // FUNCTION: toggleRedFlag(id)
        // PURPOSE:  Same accordion logic as toggleTactic() but used
        //           for the red flag cards in Module 2 and the
        //           everyday habits cards in Module 4.
        // PARAMETER:
        //   id (string) — matches body div id e.g. 'rf1', 'habit1'
        // ════════════════════════════════════════════════════════════
        function toggleRedFlag(id) {
            const body = document.getElementById(id);
            const arrow = document.getElementById('arrow-' + id);
            if (body.style.display === 'none') {
                body.style.display = 'block';
                arrow.style.transform = 'rotate(180deg)';
            } else {
                body.style.display = 'none';
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        // Tactic exercise multi-select
        window.tacticSelections = {};


        // ════════════════════════════════════════════════════════════
        // FUNCTION: selectTactic(btn, qId, tactic)
        // PURPOSE:  Handles multi-select answers in Module 3's
        //           tactic identification exercise (Q1 — select all).
        // HOW IT WORKS:
        //   1. Maintains a window.tacticSelections object to track
        //      which tactics the user has selected per question
        //   2. If tactic not already selected — adds it and
        //      highlights the button green
        //   3. If tactic already selected — removes it and
        //      resets button style (acts as a toggle)
        // PARAMETERS:
        //   btn    — the button DOM element that was clicked
        //   qId    — question ID string e.g. 'q1'
        //   tactic — tactic string e.g. 'authority', 'scarcity'
        // ════════════════════════════════════════════════════════════
        function selectTactic(btn, qId, tactic) {
            if (!window.tacticSelections[qId]) window.tacticSelections[qId] = [];
            const idx = window.tacticSelections[qId].indexOf(tactic);
            if (idx === -1) {
                window.tacticSelections[qId].push(tactic);
                btn.style.background = 'var(--green)';
                btn.style.color = 'var(--navy)';
                btn.style.borderColor = 'var(--green)';
            } else {
                window.tacticSelections[qId].splice(idx, 1);
                btn.style.background = 'white';
                btn.style.color = 'var(--text-dark)';
                btn.style.borderColor = 'var(--border)';
            }
        }


        // ════════════════════════════════════════════════════════════
        // FUNCTION: checkTactics(qId, correct)
        // PURPOSE:  Validates the user's multi-select tactic answer
        //           in Module 3 Exercise 1 when they click Check.
        // HOW IT WORKS:
        //   1. Gets the user's selections from window.tacticSelections
        //   2. Checks that every correct answer is selected AND
        //      no incorrect answers are selected
        //   3. Shows correct or incorrect feedback accordingly
        // PARAMETERS:
        //   qId     — question ID string e.g. 'q1'
        //   correct — array of correct tactic strings
        //             e.g. ['authority', 'urgency']
        // ════════════════════════════════════════════════════════════
        function checkTactics(qId, correct) {
            const selected = window.tacticSelections[qId] || [];
            const feedbackDiv = document.getElementById('tactic-feedback-' + qId);
            const allCorrect = correct.every(c => selected.includes(c)) && selected.every(c => correct.includes(c));
            feedbackDiv.className = 'feedback show ' + (allCorrect ? 'feedback-correct' : 'feedback-wrong');
            if (allCorrect) {
                feedbackDiv.innerHTML = '<strong>✓ Correct!</strong> This message uses <strong>Authority</strong> ("official partner of the club") and <strong>Urgency</strong> ("expires at midnight tonight") to pressure you into acting fast without verifying the offer.';
            } else {
                feedbackDiv.innerHTML = '<strong>✗ Not quite.</strong> Look again — the message claims to be an <strong>official partner</strong> (Authority) and creates a time deadline of <strong>midnight tonight</strong> (Urgency). Both tactics are present together.';
            }
        }


        // ════════════════════════════════════════════════════════════
        // FUNCTION: selectTacticSingle(btn, qId, tactic)
        // PURPOSE:  Handles single-select answers in Module 3's
        //           tactic identification exercise (Q2 — one answer).
        // HOW IT WORKS:
        //   1. Resets ALL buttons in the question to unselected
        //   2. Highlights only the clicked button in navy
        //   3. Immediately shows feedback — no separate Check button
        //      needed for single-answer questions
        //   4. Provides tailored feedback for each wrong answer
        //      explaining why it's incorrect
        // PARAMETERS:
        //   btn    — the button DOM element that was clicked
        //   qId    — question ID string
        //   tactic — the tactic the user selected
        // ════════════════════════════════════════════════════════════
        function selectTacticSingle(btn, qId, tactic) {
            // Reset all buttons in this question
            const btns = document.querySelectorAll('[onclick*="selectTacticSingle"][onclick*="' + qId + '"]');
            btns.forEach(b => {
                b.style.background = 'white';
                b.style.color = 'var(--text-dark)';
                b.style.borderColor = 'var(--border)';
            });
            btn.style.background = 'var(--navy)';
            btn.style.color = 'white';
            btn.style.borderColor = 'var(--navy)';

            const feedbackDiv = document.getElementById('tactic-feedback-' + qId);
            feedbackDiv.className = 'feedback show ' + (tactic === 'liking' ? 'feedback-correct' : 'feedback-wrong');
            if (tactic === 'liking') {
                feedbackDiv.innerHTML = '<strong>✓ Correct!</strong> This is <strong>Liking</strong> — the attacker presents themselves as a fellow passionate fan to build trust and make you feel you have something in common. The appeal to shared identity ("someone who actually cares") is designed to lower your guard.';
            } else if (tactic === 'authority') {
                feedbackDiv.innerHTML = '<strong>✗ Not quite.</strong> There\'s no claim of authority here \u2014 no official title or organisation. The main tactic is <strong>Liking</strong>: presenting as a fellow passionate fan to build trust through shared identity.';
            } else if (tactic === 'scarcity') {
                feedbackDiv.innerHTML = '<strong>✗ Not quite.</strong> There\'s no mention of limited availability here. The main tactic is <strong>Liking</strong>: the attacker builds rapport by presenting themselves as a genuine long-term fan just like you.';
            } else {
                feedbackDiv.innerHTML = '<strong>✗ Not quite.</strong> There\'s no time pressure here. The main tactic is <strong>Liking</strong>: the attacker builds trust by presenting as a fellow fan with shared values, making you feel they\'re trustworthy before any money is mentioned.';
            }
        }


        // ── Module 4 final exercise: safety scenario answer handler ──

        // ════════════════════════════════════════════════════════════
        // FUNCTION: answerSafety(choice)
        // PURPOSE:  Handles the Module 4 matchday scenario exercise.
        //           The user picks from options A, B, C, or D.
        // HOW IT WORKS:
        //   1. Resets all button styles to unselected
        //   2. Highlights the selected button
        //   3. Shows tailored feedback for each option:
        //      B = correct (green), A/C/D = incorrect (red/navy)
        //   4. Each wrong answer explains specifically why it
        //      is unsafe or suboptimal, not just "wrong"
        // PARAMETER:
        //   choice (string) — 'a', 'b', 'c', or 'd'
        // ════════════════════════════════════════════════════════════
        function answerSafety(choice) {
            const feedback = document.getElementById('safety-exercise-feedback');
            const btns = document.querySelectorAll('[onclick*="answerSafety"]');
            btns.forEach(b => {
                b.style.background = 'white';
                b.style.color = 'var(--text-dark)';
                b.style.borderColor = 'var(--border)';
            });
            const selected = document.querySelector('[onclick="answerSafety(\'' + choice + '\')"]');
            if (choice === 'b') {
                selected.style.background = 'var(--green)';
                selected.style.color = 'var(--navy)';
                selected.style.borderColor = 'var(--green-dark)';
                feedback.className = 'feedback show feedback-correct';
                feedback.innerHTML = '<strong style="font-size:1.1em;">&#10003; Correct &#8212; Option B is the safest choice.</strong><ul style="margin-top:12px; padding-left:20px; line-height:2;"><li>The WiFi network StadiumWiFi_Free is unverified &#8212; logging in on it could expose your credentials to a rogue hotspot.</li><li>The new sign-in notification is a serious warning that someone may be targeting your account.</li><li>Switching to mobile data removes the network risk entirely. Logging in over your own mobile connection is safe.</li><li>After getting in, change your password and check your account activity.</li></ul>';
            } else if (choice === 'a') {
                selected.style.background = '#f44336';
                selected.style.color = 'white';
                selected.style.borderColor = '#c62828';
                feedback.className = 'feedback show feedback-wrong';
                feedback.innerHTML = '<strong>&#10007; This is the most dangerous option.</strong><p style="margin-top:10px; line-height:1.7;">Logging into your account on an unverified public WiFi &#8212; especially one suggested by a stranger &#8212; puts your credentials at serious risk. The new sign-in notification suggests someone may already be targeting your account. Time pressure is exactly the condition attackers rely on to make you skip safety checks.</p>';
            } else if (choice === 'c') {
                selected.style.background = '#f44336';
                selected.style.color = 'white';
                selected.style.borderColor = '#c62828';
                feedback.className = 'feedback show feedback-wrong';
                feedback.innerHTML = '<strong>&#10007; Ignoring the sign-in alert is a serious mistake.</strong><p style="margin-top:10px; line-height:1.7;">A new sign-in notification you did not initiate means someone else may be accessing your account right now. Ignoring it and trying another unverified network compounds the risk. Treat this notification as urgent and act on it immediately.</p>';
            } else {
                selected.style.background = 'var(--navy)';
                selected.style.color = 'white';
                selected.style.borderColor = 'var(--navy)';
                feedback.className = 'feedback show feedback-wrong';
                feedback.innerHTML = '<strong>&#10007; Not wrong, but not the best option.</strong><p style="margin-top:10px; line-height:1.7;">Going to the box office is a reasonable fallback if everything else fails, but it is not necessary here. You can solve this safely in seconds by switching to mobile data. Option B resolves the situation immediately and securely without any queue.</p>';
            }
        }

        // ════════════════════════════════════════════════════════════
        // INITIALISATION
        // Runs immediately when the page loads.
        // Calls loadModule('home') to render the homepage content
        // into #main-content so the user sees the module cards.
        // ════════════════════════════════════════════════════════════
        // Load home view on start
        loadModule('home');
    </script>
